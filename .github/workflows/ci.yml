name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  js-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run generated artifact hygiene check
        run: npm run check:hygiene

      - name: Install dependencies
        run: npm ci

      - name: Build JavaScript packages
        run: npm --workspace @openjobs/sdk run build && npm --workspace @openjobs/cli run build

      - name: Run workspace typechecks
        run: npm --workspaces --if-present run typecheck

      - name: Run TypeScript linting
        run: npm run lint:ts

      - name: Run example smoke checks
        run: npm run check:examples

      - name: Run version consistency check
        run: npm run check:versions

      - name: Run npm pack verification
        run: npm run check:npm-pack

      - name: Run SDK JavaScript behavioral checks
        run: npm run check:sdk-js-tests

      - name: Run CLI smoke checks
        run: npm run check:cli-smoke

      - name: Verify CI workflow wiring
        run: npm run check:ci-workflow

  python-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Install Python package check tools
        run: python -m pip install --upgrade pip build twine

      - name: Compile Python packages
        run: python -m compileall -q packages/sdk-python packages/openjobs-langchain packages/openjobs-crewai packages/openjobs-openai

      - name: Run Python package build/check flow
        run: npm run check:python-packages
